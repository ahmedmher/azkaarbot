name: Menu

# يفحص كل 5 دقائق رسائل /start و /menu ويرد بقائمة الأذكار.
# (GitHub Actions لا يدعم تشغيلاً دائماً، فالرد قد يتأخر حتى ~5 دقائق.)
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency: menu

jobs:
  menu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python bot.py menu
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
