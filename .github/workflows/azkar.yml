name: Azkar

# الأوقات بتوقيت UTC. الافتراضي = توقيت القاهرة (UTC+3 صيفي / UTC+2 شتوي).
# عدّلها حسب بلدك (مثلاً الرياض UTC+3 → الصباح 05:00 = 02:00 UTC)..
on:
  schedule:
    - cron: "0 3 * * *"    # الصباح  ~ 06:00 القاهرة
    - cron: "0 14 * * *"   # المساء  ~ 17:00 القاهرة
    - cron: "30 19 * * *"  # النوم   ~ 22:30 القاهرة
  workflow_dispatch:
    inputs:
      category:
        description: "مفتاح القسم (morning / evening / sleep / wakeup / after_prayer أو c1, c2 للأقسام المضافة) - يُرسل لكل المستخدمين"
        type: string
        default: morning

concurrency: azkar

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pick category
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "cat=${{ inputs.category }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "0 3 * * *")   echo "cat=morning" >> "$GITHUB_OUTPUT" ;;
              "0 14 * * *")  echo "cat=evening" >> "$GITHUB_OUTPUT" ;;
              "30 19 * * *") echo "cat=sleep"   >> "$GITHUB_OUTPUT" ;;
            esac
          fi
      - name: Send
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then ARGS="--all"; fi
          python bot.py send "${{ steps.pick.outputs.cat }}" $ARGS
